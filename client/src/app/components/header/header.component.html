<header class="bg-white shadow-lg sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <div class="flex-shrink-0">
          <img src="/images/jpeg/bioplus.jpeg" alt="BioPlus Laboratory" width="100">
          <!-- <h1 class="text-2xl font-bold text-blue-600">
            <i class="pi pi-heart text-red-500 mr-2"></i>
            BioPlus
          </h1> -->
        </div>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex space-x-8">
        <a routerLink="/home" 
           routerLinkActive="text-blue-600 border-b-2 border-blue-600" 
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors duration-200">
          <i class="pi pi-home mr-1"></i>Home
        </a>
        <a routerLink="/about" 
           routerLinkActive="text-blue-600 border-b-2 border-blue-600" 
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors duration-200">
          <i class="pi pi-info-circle mr-1"></i>About Us
        </a>
        <!-- <a routerLink="/pricing" 
           routerLinkActive="text-blue-600 border-b-2 border-blue-600" 
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors duration-200">
          <i class="pi pi-indian-rupee mr-1"></i>Pricing
        </a> -->
        <a routerLink="/contact" 
           routerLinkActive="text-blue-600 border-b-2 border-blue-600" 
           class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors duration-200">
          <i class="pi pi-phone mr-1"></i>Contact Us
        </a>
      </nav>

      <!-- Book Appointment Button -->
      <div class="flex items-center">
        <p-button 
          label="Book Appointment" 
          icon="pi pi-calendar-plus" 
          severity="success"
          size="small"
          (onClick)="openAppointmentDialog()"
          class="text-white font-semibold px-4 py-2 rounded-lg transition-colors duration-200">
        </p-button>
      </div>

      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button type="button" 
                class="text-gray-700 hover:text-blue-600 focus:outline-none focus:text-blue-600"
                (click)="toggleMobileMenu()">
          <i class="pi pi-bars text-xl"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    <div class="md:hidden" [class.hidden]="!mobileMenuOpen">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3 bg-gray-50 rounded-lg mt-2">
        <a routerLink="/home" 
           routerLinkActive="text-blue-600 bg-blue-50" 
           class="text-gray-700 hover:text-blue-600 block px-3 py-2 text-base font-medium rounded-md">
          <i class="pi pi-home mr-2"></i>Home
        </a>
        <a routerLink="/about" 
           routerLinkActive="text-blue-600 bg-blue-50" 
           class="text-gray-700 hover:text-blue-600 block px-3 py-2 text-base font-medium rounded-md">
          <i class="pi pi-info-circle mr-2"></i>About Us
        </a>
        <a routerLink="/pricing" 
           routerLinkActive="text-blue-600 bg-blue-50" 
           class="text-gray-700 hover:text-blue-600 block px-3 py-2 text-base font-medium rounded-md">
          <i class="pi pi-dollar mr-2"></i>Pricing
        </a>
        <a routerLink="/contact" 
           routerLinkActive="text-blue-600 bg-blue-50" 
           class="text-gray-700 hover:text-blue-600 block px-3 py-2 text-base font-medium rounded-md">
          <i class="pi pi-phone mr-2"></i>Contact Us
        </a>
      </div>
    </div>
  </div>

  <!-- Appointment Dialog -->
  <app-appointment-dialog 
    [visible]="showAppointmentDialog" 
    (visibleChange)="showAppointmentDialog = $event">
  </app-appointment-dialog>
</header>
